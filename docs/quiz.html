 "Returns the same 201 the second time, files once, marks it Idempotent-Replay", "Returns 409"], "c": 1, "w": "L07: the receipt number makes retries safe.", "p": 2}, {"q": "Should a client retry a 400?", "o": ["Yes, with backoff", "No — the slip is wrong; retry 429/5xx/timeouts only, with backoff and jitter", "Only three times"], "c": 1, "w": "L07/L10.", "p": 2}, {"q": "Why prefer cursor pagination for a growing list?", "o": ["It shows page numbers", "It stays stable when rows are inserted and stays fast with an index; offsets skip or duplicate", "It compresses better"], "c": 1, "w": "L08.", "p": 2}, {"q": "Which change forces /v2?", "o": ["Adding an optional field", "Renaming or removing a field, or changing a type — clients would break", "Adding a new endpoint"], "c": 1, "w": "L09: additive is safe; breaking gets a new version and a sunset date.", "p": 2}, {"q": "429 with Retry-After: 10 arrives. The polite client…", "o": ["Retries immediately", "Waits ~10 s (plus jitter), retries, and gives up after a few attempts", "Switches to POST"], "c": 1, "w": "L10: the queue at the counter.", "p": 2}, {"q": "When is a webhook the right shape?", "o": ["When the client wants data on demand", "When the server should tell the client that something happened — instead of polling every 5 s", "For all public APIs"], "c": 1, "w": "L11: the counter calls you back.", "p": 2}, {"q": "Three jobs an API gateway takes off your API?", "o": ["Business logic, storage, UI", "Auth, rate limiting and routing/logging — in front of every counter", "Testing, docs, versioning"], "c": 1, "w": "L12: the school gate.", "p": 2}, {"q": "Which methods are safe — they change nothing on the server?", "o": ["GET, HEAD, OPTIONS", "GET and POST", "Only GET"], "c": 0, "w": "L13: safe means read-only; HEAD and OPTIONS are safe too. PUT and DELETE are idempotent but not safe.", "p": 3}, {"q": "You send the same PUT twice. What happens?", "o": ["Two copies are created", "The same state as after one PUT — PUT is <script id="i18n-js">
var I18N_INLINE={A:1,SPAN:1,CODE:1,B:1,I:1,EM:1,STRONG:1,BUTTON:1,LABEL:1,SUMMARY:1,SMALL:1,KBD:1};
function schoolSetLang(l){
  if(l!=='en'&&l!=='mr'&&l!=='both') l='both';
  try{localStorage.setItem('school-lang2',l)}catch(e){}
  document.documentElement.setAttribute('lang', l==='en' ? 'en' : 'mr');
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-mr')) el.setAttribute('data-mr', el.innerHTML);
    var en=el.getAttribute('data-en'), mr=el.getAttribute('data-mr');
    var svg = el.namespaceURI && el.namespaceURI.indexOf('svg')>-1;
    if(svg){
      el.innerHTML = (l==='en') ? en : mr;
      var t=el.querySelector('title'); if(t) t.remove();
      if(l==='both'){ t=document.createElementNS('http://www.w3.org/2000/svg','title'); t.textContent=en.replace(/<[^>]+>/g,''); el.insertBefore(t, el.firstChild); }
      return;
    }
    if(l==='en') el.innerHTML = en;
    else if(l==='mr') el.innerHTML = mr;
    else if(en.replace(/\s+/g,' ').trim()===mr.replace(/\s+/g,' ').trim()) el.innerHTML = mr;
    else {
      var e2=en.replace(/<span class="(ln|num|wk)">[\s\S]*?<\/span>\s*/g,'');
      if(e2.charAt(0)!=='<' && mr.charAt(0)!=='<'){           /* drop the prefix both languages share, e.g. "01 · 🏢 " */
        var i=0; while(i<e2.length&&i<mr.length&&e2.charAt(i)===mr.charAt(i)) i++;
        var cut=e2.lastIndexOf(' ',i); if(cut>0 && cut<e2.length-1) e2=e2.slice(cut+1);
      }
      el.innerHTML = mr + '<span class="i18n-en'+(I18N_INLINE[el.tagName]?' i':'')+'">'+e2+'</span>';
    }
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if(!el.hasAttribute('data-mr-ph')) el.setAttribute('data-mr-ph', el.getAttribute('placeholder'));
    el.setAttribute('placeholder', (l==='en') ? el.getAttribute('data-en-ph') : (l==='mr' ? el.getAttribute('data-mr-ph') : el.getAttribute('data-mr-ph')+' / '+el.getAttribute('data-en-ph')));
  });
  var p=document.getElementById('lang-pick'); if(p) p.value=l;
}
(function(){ var l='both'; try{ l=localStorage.getItem('school-lang2')||'both'; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){schoolSetLang(l)}); else schoolSetLang(l); })();

const L=(en,m)=> mr()? m+' · '+en.replace(/^[^\w\s(]+\s+/,'') : en;
const fab=document.createElement('div');fab.id='navfab';
fab.innerHTML='<button class="fb fb-top" aria-label="Back to top">↑</button><button class="fb fb-main" aria-label="Topics"><span class="ic">🧭</span><span class="lb">Topics</span></button>';
const pan=document.createElement('div');pan.id='navpanel';pan.setAttribute('role','dialog');
document.body.appendChild(pan);document.body.appendChild(fab);
const top=fab.querySelector('.fb-top'),main=fab.querySelector('.fb-main');
const txt=e=>(e.textContent||'').replace(/\s+/g,' ').trim();
function items(){  // every lesson section and every page-level heading, in page order
  const out=[];const seen=new Set();let k=0;
  document.querySelectorAll('h2:not([id]), .school > h3').forEach(h=>{if(h.closest('section.dsec,#navpanel,#zoomov'))return;const host=h.matches('.school > h3')?h.parentElement:h;if(!host.id)host.id='nav-'+(++k)});
  document.querySelectorAll('section.dsec[id], h2[id], section[id] > h2, .school[id]').forEach(e=>{
    const sec=e.matches('section')?e:(e.closest('section.dsec')||null);
    const target=sec&&sec.id?sec:e; if(!target.id||seen.has(target.id))return;
    if(!sec&&e.closest('#navpanel,#zoomov'))return;
    seen.add(target.id);
    const h=sec?(sec.querySelector('h2,h3')||sec):(e.matches('.school')?(e.querySelector('h3')||e):e); const ln=h.querySelector&&h.querySelector('.ln');
    const c=h.cloneNode(true); const en=c.querySelector&&c.querySelector('.i18n-en'); const et=en?txt(en):''; if(en)en.remove();
    const lnc=c.querySelector&&c.querySelector('.ln'); let n=''; if(lnc){n=txt(lnc); lnc.remove()}
    let t=txt(c); if(!t)return; const cut=x=>x.length>90?x.slice(0,88)+'…':x;
    out.push({id:target.id,n,t:cut(t),e:et&&et!==t?cut(et):''});
  });
  return out;
}
let cur=null;
function build(){
  const its=items();const q=(pan.querySelector('input')||{}).value||'';
  const here=its.map(i=>`<a href="#${i.id}" data-id="${i.id}" class="${i.id===cur?'cur':''}"><span class="nn">${i.n||'•'}</span><span>${i.t}${i.e?`<small>${i.e}</small>`:''}</span></a>`).join('');
  const pages=PAGES.filter(p=>p[0]!==HERE).map(p=>`<a href="${p[0]}"><span>${L(p[1],p[2])}</span></a>`).join('');
  pan.innerHTML=`<div class="nh"><b>🧭 ${L('Jump to a topic','विषयावर जा')}<button class="nx" aria-label="close">✕</button></b><input type="search" placeholder="${mr()?'शोधा · filter…':'filter…'}" value="${q.replace(/"/g,'&quot;')}"></div>
   <div class="nb">${its.length?`<div class="ng">${L('On this page','या पानावर')}</div><div class="here">${here}</div>`:''}
   ${pages?`<div class="ng">${L('Other pages','इतर पाने')}</div>${pages}`:''}
   ${PORTAL?`<div class="ng">${L('The School','शाळा')}</div><a href="${PORTAL}"><span>🏫 ${L('All schools','सर्व शाळा')}</span></a>`:''}</div>`;
  const inp=pan.querySelector('input');inp.addEventListener('input',()=>{const v=inp.value.toLowerCase();pan.querySelectorAll('.nb a').forEach(a=>{a.style.display=!v||a.textContent.toLowerCase().includes(v)?'':'none'})});
  inp.dispatchEvent(new Event('input'));
}
function open(){build();pan.classList.add('on');const c=pan.querySelector('a.cur');if(c)c.scrollIntoView({block:'center'});setTimeout(()=>{if(innerWidth>640)pan.querySelector('input').focus()},30)}
function close(){pan.classList.remove('on')}
main.addEventListener('click',e=>{e.stopPropagation();pan.classList.contains('on')?close():open()});
pan.addEventListener('click',e=>{if(e.target.closest('.nx')){close();return}const a=e.target.closest('a');if(a&&a.getAttribute('href').startsWith('#'))close();e.stopPropagation()});
document.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
addEventListener('scroll',()=>{top.classList.toggle('on',scrollY>600)},{passive:true});
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){cur=en.target.id;pan.querySelectorAll('.here a').forEach(a=>a.classList.toggle('cur',a.dataset.id===cur))}})},{rootMargin:'-35% 0px -60% 0px'});
 items().forEach(i=>{const t=document.getElementById(i.id);if(t)io.observe(t)})}
})();
</script></div><!--/navfab-js-->
</body>
</html>
